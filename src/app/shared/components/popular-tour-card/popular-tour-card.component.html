<div class="group relative w-full bg-pure-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col h-full cursor-pointer">
  
  <!-- Image Container -->
  <div class="relative w-full h-56 overflow-hidden bg-gray-100 flex items-center justify-center">
    <!-- Small Centered Loader -->
    <div *ngIf="isImageLoading()" class="absolute inset-0 flex items-center justify-center z-0">
      <div class="w-6 h-6 rounded-full border-[2px] border-secondary-gold/30 border-t-secondary-gold animate-spin"></div>
    </div>

    <img [src]="tour.featuredImage" [alt]="tour.title"
      class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
      [ngClass]="{'opacity-0': isImageLoading(), 'opacity-100': !isImageLoading()}"
      (load)="isImageLoading.set(false)"
      loading="lazy" />
  </div>

  <!-- Floating Stats Badge -->
  <div class="relative z-10 px-6 -mt-6">
    <div class="bg-pure-white shadow-md rounded-xl py-3 px-4 flex items-center justify-between text-xs font-semibold text-text-dark">
      <div class="flex items-center gap-4">
        <!-- Calendar Icon -->
        <div class="flex items-center gap-1.5 text-secondary-gold">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="text-text-dark">{{ tour.durationDays }} day{{ tour.durationDays > 1 ? 's' : '' }}</span>
        </div>
        <!-- Group Size Icon -->
        <div class="flex items-center gap-1.5 text-secondary-gold">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span class="text-text-dark">{{ tour.groupSizeMax }}</span>
        </div>
      </div>
      
      <!-- Gallery Icon -->
      <div class="flex items-center gap-1 text-gray-400">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>{{ tour.galleryImages?.length || 0 }}</span>
      </div>
    </div>
  </div>

  <!-- Content Container -->
  <div class="p-6 flex-1 flex flex-col pt-4">
    <!-- Title -->
    <h3 class="text-xl font-bold text-text-dark mb-2 group-hover:text-secondary-gold transition-colors duration-300 font-heading">
      {{ tour.title }}
    </h3>
    
    <!-- Location -->
    <div class="flex items-center gap-1.5 text-sm text-gray-400 mb-4">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>{{ tour.city }}{{ tour.country ? ', ' + tour.country : '' }}</span>
    </div>

    <!-- Divider -->
    <hr class="border-gray-100 my-auto mb-4" />

    <!-- Footer -->
    <div class="flex items-center justify-between">
      <div class="text-sm font-semibold text-gray-400">
      </div>
      
      <a [routerLink]="['/tours', tour.slug]" class="text-primary-blue font-bold text-sm hover:text-secondary-gold transition-colors duration-300 flex items-center gap-1 group/btn">
        Explore
        <svg class="w-4 h-4 transform group-hover/btn:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>
    </div>
  </div>
</div>
