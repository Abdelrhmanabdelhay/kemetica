<div class="group relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800/80 hover:border-amber-500/50 transition-all duration-500 hover:shadow-2xl hover:shadow-amber-500/10 flex flex-col h-full">
  
  <!-- Image Container with Zoom Effect -->
  <div class="relative h-64 w-full overflow-hidden bg-slate-950">
    <img 
      [src]="tour.featuredImage" 
      [alt]="tour.title"
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out brightness-90 group-hover:brightness-100"
      loading="lazy"
    />
    
    <!-- Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>

    <!-- Badge -->
    <div *ngIf="tour.badge" class="absolute top-4 left-4">
      <span class="px-3 py-1 text-xs font-bold tracking-wide uppercase rounded-full bg-amber-500 text-slate-950 shadow-lg">
        {{ tour.badge }}
      </span>
    </div>

    <!-- Duration Tag -->
    <div class="absolute top-4 right-4 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 text-xs font-semibold text-slate-200 flex items-center gap-1.5">
      <span>⏳</span>
      <span>{{ tour.durationDays }} Days</span>
    </div>

    <!-- Location & Category -->
    <div class="absolute bottom-3 left-4 right-4 flex items-center justify-between text-xs text-slate-300">
      <span class="flex items-center gap-1 font-medium text-amber-400">
        📍 {{ tour.location.city }}
      </span>
      <span class="bg-slate-900/80 px-2.5 py-0.5 rounded-full uppercase text-[10px] tracking-wider border border-slate-700/60">
        {{ tour.category | uppercase }}
      </span>
    </div>
  </div>

  <!-- Content Body -->
  <div class="p-6 flex flex-col flex-grow justify-between space-y-4">
    <div>
      <div class="flex items-center gap-2 mb-2">
        <div class="flex items-center text-amber-400 text-sm">
          <span>★</span>
          <span class="ml-1 font-bold text-slate-100">{{ tour.rating }}</span>
        </div>
        <span class="text-xs text-slate-500">({{ tour.reviewCount }} reviews)</span>
      </div>

      <h3 class="text-lg font-bold text-slate-100 group-hover:text-amber-400 transition-colors line-clamp-2">
        {{ tour.title }}
      </h3>
      
      <p class="text-sm text-slate-400 mt-2 line-clamp-2">
        {{ tour.tagline }}
      </p>

      <!-- Highlights Pills -->
      <div class="mt-4 flex flex-wrap gap-1.5">
        <span *ngFor="let h of tour.highlights.slice(0, 2)" class="text-[11px] px-2.5 py-1 rounded-md bg-slate-800/70 border border-slate-700/50 text-slate-300">
          ✓ {{ h | truncate:30 }}
        </span>
      </div>
    </div>

    <!-- Pricing and Action Footer -->
    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
      <div>
        <span class="block text-[11px] text-slate-500 uppercase tracking-wider">From per guest</span>
        <div class="text-xl font-bold text-amber-400 font-serif">
          {{ tour.price | currencyFormat }}
        </div>
      </div>

      <a routerLink="/contact" 
         class="px-4 py-2 rounded-xl bg-slate-800 group-hover:bg-amber-500 text-slate-200 group-hover:text-slate-950 font-semibold text-xs transition-all duration-300 flex items-center gap-1">
        <span>Reserve</span>
        <span>→</span>
      </a>
    </div>

  </div>

</div>
