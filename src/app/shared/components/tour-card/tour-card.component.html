<div
  class="group relative w-full h-[450px] rounded-2xl overflow-hidden bg-bg-sand cursor-pointer shadow-lg hover:shadow-2xl hover:shadow-primary-blue/20 transition-all duration-500">

  <!-- Background Image with Zoom on Hover -->
  <img [src]="tour.featuredImage" [alt]="tour.title"
    class="absolute inset-0 w-full h-full object-cover scale-105  transition-transform duration-700 ease-out group-hover:scale-110"
    loading="lazy" />

  <!-- Dark Gradient Overlay -->
  <div
    class="absolute inset-0 bg-gradient-to-t from-[#0F284B] via-[#0F284B]/40 to-transparent opacity-70 group-hover:opacity-95 transition-all duration-500">
  </div>

  <!-- Content positioned at bottom -->
  <div class="absolute bottom-0 left-0 right-0 p-6 flex justify-between items-end pb-8 z-10">
    <h3 class="text-2xl font-bold font-heading text-white line-clamp-2 pr-4 drop-shadow-md">
      {{ tour.city }}
    </h3>
    <span class="text-sm font-semibold text-white whitespace-nowrap drop-shadow-md tracking-wide">
      {{ toursCount }} Tours
    </span>
  </div>

  <!-- Gold Line on Hover -->
  <div
    class="absolute bottom-0 left-[5%] right-[5%] h-1.5 bg-secondary-gold rounded-t-sm opacity-0 translate-y-full group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 ease-out z-20">
  </div>

</div>
