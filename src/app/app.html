<div class="min-h-screen flex flex-col bg-bg-sand text-text-dark font-sans selection:bg-secondary-gold selection:text-pure-white">
  
  <!-- Global Toast Notifications -->
  <div class="fixed top-24 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
    <div 
      *ngFor="let toast of notificationService.notifications()"
      class="pointer-events-auto flex items-center justify-between p-4 rounded-xl shadow-2xl border backdrop-blur-lg animate-in fade-in slide-in-from-top-2 duration-300"
      [ngClass]="{
        'bg-emerald-950/90 border-emerald-500/40 text-emerald-200': toast.type === 'success',
        'bg-rose-950/90 border-rose-500/40 text-rose-200': toast.type === 'error',
        'bg-sky-950/90 border-sky-500/40 text-sky-200': toast.type === 'info',
        'bg-amber-950/90 border-amber-500/40 text-amber-200': toast.type === 'warning'
      }"
    >
      <span class="text-xs font-medium">{{ toast.message }}</span>
      <button (click)="notificationService.dismiss(toast.id)" class="ml-3 text-slate-400 hover:text-white text-sm">
        ✕
      </button>
    </div>
  </div>

  <!-- Core Navbar -->
  <app-navbar></app-navbar>

  <!-- Main Route Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Core Footer -->
  <app-footer></app-footer>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/201155025608" target="_blank" rel="noopener noreferrer" 
     class="fixed bottom-6 left-6 z-50 flex items-center justify-center w-14 h-14 bg-[#25D366] text-pure-white rounded-full shadow-xl hover:bg-[#128C7E] hover:scale-110 transition-all duration-300">
    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </a>

  <!-- Floating Language Selector -->
  <div class="fixed bottom-6 right-6 z-50">
    <button class="flex items-center gap-2 bg-pure-white text-text-dark px-4 py-2.5 rounded-lg shadow-lg hover:shadow-xl transition-all font-semibold border border-gray-100">
      <span class="text-xl">🇬🇧</span>
      <span class="text-sm">EN</span>
      <svg class="w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
      </svg>
    </button>
  </div>

</div>
