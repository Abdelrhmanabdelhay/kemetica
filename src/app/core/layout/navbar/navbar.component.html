<header
  class="fixed top-2 left-2 right-2 md:top-4 md:left-4 md:right-4 z-50 rounded-full bg-[#E5E5E5] shadow-md transition-all duration-300">
  <div class="px-6 lg:px-10">
    <div class="flex items-center justify-between h-16 sm:h-20">

      <!-- Left: Brand Logo -->
      <a routerLink="/" class="flex items-center gap-2 group focus:outline-none shrink-0">
        <img src="/logo-Photoroom.png" alt="Logo"
          class="h-16 sm:h-20 w-auto scale-110 origin-left group-hover:scale-125 transition-transform duration-300 mix-blend-multiply">
      </a>

      <!-- Center: Navigation Links -->
      <nav class="hidden lg:flex items-center justify-center gap-8 xl:gap-10 absolute left-1/2 -translate-x-1/2">
        <a *ngFor="let item of navItems" [routerLink]="item.path" [queryParams]="item.queryParams"
          class="flex items-baseline text-[15px] font-semibold text-gray-900 hover:text-black transition-colors py-1 group">
          {{ item.label }}
          <span class="text-[#B88F45] font-black ml-1 text-2xl leading-[0]">.</span>
        </a>
      </nav>

      <!-- Right: Phone, Grid Icon, Hamburger -->
      <div class="flex items-center gap-4 shrink-0">

        <!-- Phone Number & Grid Icon -->
        <a href="tel:+201155025608"
          class="hidden sm:flex items-center gap-2 text-gray-900 hover:text-black transition-colors font-bold text-sm">
          <svg class="w-4 h-4 text-[#B88F45]" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="4" cy="4" r="2.5" />
            <circle cx="12" cy="4" r="2.5" />
            <circle cx="20" cy="4" r="2.5" />
            <circle cx="4" cy="12" r="2.5" />
            <circle cx="12" cy="12" r="2.5" />
            <circle cx="20" cy="12" r="2.5" />
            <circle cx="4" cy="20" r="2.5" />
            <circle cx="12" cy="20" r="2.5" />
            <circle cx="20" cy="20" r="2.5" />
          </svg>
          <span class="mt-0.5">+201155025608</span>
        </a>

        <!-- Hamburger Menu -->
        <button (click)="toggleMobileMenu()"
          class="p-2 text-gray-900 hover:text-black rounded-full hover:bg-black/5 transition-all focus:outline-none ml-2">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div *ngIf="isMobileMenuOpen()"
    class="lg:hidden absolute top-full left-0 right-0 mt-2 bg-pure-white/95 backdrop-blur-xl border border-gray-200 rounded-2xl p-4 shadow-xl space-y-2 mx-4 origin-top">
    <a *ngFor="let item of navItems" [routerLink]="item.path" [queryParams]="item.queryParams"
      (click)="closeMobileMenu()" routerLinkActive="text-secondary-gold bg-bg-sand font-bold"
      [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      class="flex items-center px-4 py-3 rounded-xl text-base font-semibold text-primary-blue hover:bg-bg-sand hover:text-secondary-gold transition-colors">
      <span class="w-1.5 h-1.5 rounded-full bg-secondary-gold mr-3"></span>
      {{ item.label }}
    </a>

    <div class="pt-4 border-t border-gray-100 flex flex-col gap-4 mt-2">
      <!-- Mobile Contact Info -->
      <a href="tel:+201155025608"
        class="flex items-center justify-center gap-2 text-primary-blue font-semibold text-sm">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        <span class="font-mono">+20 115 502 5608</span>
      </a>
    </div>
  </div>
</header>
