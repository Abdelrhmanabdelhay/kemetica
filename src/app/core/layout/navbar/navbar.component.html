<header class="sticky top-0 z-50 w-full border-b border-slate-800/80 bg-slate-950/85 backdrop-blur-md transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center gap-3 group focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-400 to-yellow-200 p-[1px] shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform duration-300">
          <div class="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center">
            <span class="text-xl font-serif font-bold text-amber-400">𓋹</span>
          </div>
        </div>
        <div>
          <span class="text-xl font-bold tracking-wider uppercase font-serif text-slate-100 group-hover:text-amber-400 transition-colors">
            Kemetica
          </span>
          <span class="block text-[10px] tracking-widest text-amber-400/80 uppercase font-mono -mt-1">
            Egyptian Expeditions
          </span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-8">
        <a *ngFor="let item of navItems" 
           [routerLink]="item.path" 
           [queryParams]="item.queryParams"
           routerLinkActive="text-amber-400 font-semibold"
           [routerLinkActiveOptions]="{ exact: item.path === '/' }"
           class="text-sm font-medium text-slate-300 hover:text-amber-400 transition-colors relative py-1 group">
          {{ item.label }}
          <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-gradient-to-r from-amber-500 to-yellow-300 group-hover:w-full transition-all duration-300"></span>
        </a>
      </nav>

      <!-- Right Action CTAs -->
      <div class="hidden md:flex items-center gap-4">
        <!-- Theme Toggle -->
        <button (click)="themeService.toggleTheme()" 
                class="p-2.5 rounded-full text-slate-400 hover:text-amber-400 hover:bg-slate-900 border border-transparent hover:border-slate-800 transition-all"
                title="Toggle Theme">
          <span *ngIf="themeService.isDarkMode()" class="text-lg">🌙</span>
          <span *ngIf="!themeService.isDarkMode()" class="text-lg">☀️</span>
        </button>

        <!-- Book VIP Consultation CTA -->
        <a routerLink="/contact"
           class="px-5 py-2.5 rounded-full bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 text-slate-950 text-sm font-bold shadow-md shadow-amber-500/20 hover:shadow-amber-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300">
          Book VIP Experience
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden items-center gap-2">
        <button (click)="toggleMobileMenu()" 
                class="p-2 text-slate-400 hover:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400"
                aria-label="Toggle Navigation">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div *ngIf="isMobileMenuOpen()" class="md:hidden border-b border-slate-800 bg-slate-950/95 backdrop-blur-xl px-4 pt-2 pb-6 space-y-3">
    <a *ngFor="let item of navItems" 
       [routerLink]="item.path" 
       [queryParams]="item.queryParams"
       (click)="closeMobileMenu()"
       routerLinkActive="text-amber-400 bg-slate-900/60"
       [routerLinkActiveOptions]="{ exact: item.path === '/' }"
       class="block px-4 py-2.5 rounded-lg text-base font-medium text-slate-200 hover:bg-slate-900 hover:text-amber-400 transition-colors">
      {{ item.label }}
    </a>
    <div class="pt-4 border-t border-slate-800/80 flex flex-col gap-3">
      <a routerLink="/contact" 
         (click)="closeMobileMenu()"
         class="w-full text-center py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-bold text-sm shadow-md">
        Inquire Now
      </a>
    </div>
  </div>
</header>
