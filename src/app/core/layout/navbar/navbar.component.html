<header [ngClass]="isScrolled() ?  'bg-transparent shadow-none': 'bg-[#E5E5E5] shadow-md'"
  class="fixed top-2 left-2 right-2 md:top-4 md:left-4 md:right-4 z-50 rounded-full transition-all duration-300">
  <div class="px-6 lg:px-10">
    <div class="flex items-center justify-between h-16 sm:h-20">

      <!-- Left: Hamburger & Brand Logo -->
      <div class="flex items-center gap-1 sm:gap-3 shrink-0">
        <!-- Hamburger Menu -->
        <button (click)="toggleMobileMenu()"
          class="lg:hidden p-2 text-gray-900 hover:text-black rounded-full hover:bg-black/5 transition-all focus:outline-none -ml-2">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <!-- Desktop Brand Logo -->
        <a routerLink="/" class="hidden lg:flex items-center group focus:outline-none">
          <img src="/logo-Photoroom.png" alt="Logo"
            class="h-14 sm:h-20 w-auto scale-110 origin-left group-hover:scale-125 transition-transform duration-300 mix-blend-multiply">
        </a>
      </div>

      <!-- Center: Mobile Logo & Desktop Navigation Links -->
      <nav class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center gap-8 xl:gap-10">
        <!-- Mobile Brand Logo -->
        <a routerLink="/" class="lg:hidden flex items-center group focus:outline-none">
          <img src="/logo-Photoroom.png" alt="Logo"
            class="h-16 sm:h-20 w-auto scale-125 group-hover:scale-135 transition-transform duration-300 mix-blend-multiply">
        </a>

        <!-- Desktop Navigation Links -->
        <a *ngFor="let item of navItems" [routerLink]="item.path" [queryParams]="item.queryParams"
          class="hidden lg:flex items-baseline text-[15px] font-semibold text-gray-900 hover:text-black transition-colors py-1 group">
          {{ item.label }}
          <span class="text-[#B88F45] font-black ml-1 text-2xl leading-[0]">.</span>
        </a>
      </nav>

      <!-- Right: Phone, Grid Icon, Hamburger -->
      <div class="flex items-center gap-4 shrink-0">

        <!-- Phone Number & Grid Icon -->
        <a href="tel:+201155025608"
          class="hidden sm:flex items-center gap-2 text-gray-900 hover:text-black transition-colors font-bold text-sm">
          <svg class="w-4 h-4 text-[#B88F45]" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="4" cy="4" r="2.5" />
            <circle cx="12" cy="4" r="2.5" />
            <circle cx="20" cy="4" r="2.5" />
            <circle cx="4" cy="12" r="2.5" />
            <circle cx="12" cy="12" r="2.5" />
            <circle cx="20" cy="12" r="2.5" />
            <circle cx="4" cy="20" r="2.5" />
            <circle cx="12" cy="20" r="2.5" />
            <circle cx="20" cy="20" r="2.5" />
          </svg>
          <span class="mt-0.5">+201155025608</span>
        </a>

      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <!-- Note: We are no longer using this block, replacing it with the drawer outside the header -->
</header>

<!-- Mobile Overlay & Drawer (Outside header to avoid absolute positioning issues) -->
<ng-container *ngIf="isMobileMenuOpen()">
  <!-- Backdrop -->
  <div (click)="closeMobileMenu()"
    class="lg:hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity duration-300"></div>

  <!-- Left Side Drawer -->
  <div
    class="lg:hidden fixed inset-y-0 left-0 w-[75vw] sm:w-[50vw] bg-primary-blue z-50 shadow-2xl flex flex-col animate-[slideInLeft_0.3s_ease-out]">

    <!-- Drawer Header -->
    <div class="flex items-center justify-between p-6 border-b border-white/10">
      <span class="text-secondary-gold font-bold font-heading text-xl uppercase tracking-widest">Menu</span>
      <button (click)="closeMobileMenu()"
        class="p-2 text-pure-white hover:text-secondary-gold bg-white/5 rounded-full transition-colors">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Navigation Links -->
    <div class="flex flex-col py-4 px-2 space-y-1 overflow-y-auto">
      <a *ngFor="let item of navItems" [routerLink]="item.path" [queryParams]="item.queryParams"
        (click)="closeMobileMenu()" routerLinkActive="text-secondary-gold bg-white/5 font-bold"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="flex items-center justify-between px-4 py-4 mx-2 rounded-xl text-[17px] font-semibold text-pure-white hover:bg-white/5 hover:text-secondary-gold transition-colors border-b border-white/5 last:border-0 group">
        <span>{{ item.label }}</span>
        <span
          class="text-secondary-gold opacity-0 group-hover:opacity-100 transition-opacity text-xl font-bold leading-none">.</span>
      </a>
    </div>

    <!-- Mobile Contact Info -->
    <div class="mt-auto p-6 border-t border-white/10 bg-black/10">
      <a href="tel:+201155025608"
        class="flex items-center justify-center gap-3 text-pure-white font-semibold hover:text-secondary-gold transition-colors bg-white/5 py-4 rounded-xl border border-white/10">
        <svg class="w-5 h-5 text-secondary-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        <span class="font-mono text-sm tracking-wide">+20 115 502 5608</span>
      </a>
    </div>
  </div>
</ng-container>

<style>
  @keyframes slideInLeft {
    from {
      transform: translateX(-100%);
    }

    to {
      transform: translateX(0);
    }
  }
</style>
