<div class="min-h-screen bg-bg-sand pt-10 pb-24">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Page Header -->
    <div class="text-center max-w-3xl mx-auto mb-12">
      <span class="text-xs font-semibold text-secondary-gold uppercase tracking-widest font-mono">Curated Expeditions</span>
      <h1 class="text-4xl sm:text-5xl font-heading font-bold text-primary-blue mt-2">
        Egyptian Journeys & Privileged Access
      </h1>
      <p class="text-gray-600 mt-3 text-base">
        Explore hand-crafted itineraries curated with private permits, VIP Egyptologist scholars, and ultra-luxury stays.
      </p>
    </div>

    <!-- Filter & Search Controls -->
    <div class="mb-12 space-y-6">
      
      <!-- Category Tabs -->
      <div class="flex flex-wrap items-center justify-center gap-2">
        <button 
          *ngFor="let cat of categories"
          (click)="onCategoryChange(cat.id)"
          [ngClass]="[
            'px-5 py-2.5 rounded-full text-xs sm:text-sm font-semibold transition-all duration-300',
            selectedCategory === cat.id 
              ? 'bg-secondary-gold text-pure-white shadow-lg shadow-secondary-gold/20' 
              : 'bg-pure-white text-gray-500 hover:text-primary-blue border border-gray-200 hover:border-secondary-gold/40'
          ]"
        >
          {{ cat.label }}
        </button>
      </div>

      <!-- Search Bar -->
      <div class="max-w-xl mx-auto relative">
        <input 
          type="text" 
          [(ngModel)]="searchQuery" 
          (ngModelChange)="onSearch()"
          placeholder="Search by city, title or attraction (e.g. Giza, Dahabiya, Siwa)..." 
          class="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-pure-white border border-gray-200 text-sm text-text-dark placeholder-gray-400 focus:outline-none focus:border-secondary-gold focus:ring-1 focus:ring-secondary-gold transition-all shadow-sm"
        />
        <div class="absolute left-4 top-3.5 text-gray-400">
          🔍
        </div>
      </div>

    </div>

    <!-- Tours Grid -->
    <div *ngIf="!loading() && tours().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <app-tour-card *ngFor="let tour of tours()" [tour]="tour"></app-tour-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading() && tours().length === 0" class="text-center py-20 bg-pure-white rounded-3xl border border-gray-200 shadow-sm max-w-lg mx-auto p-8">
      <span class="text-4xl">🏛️</span>
      <h3 class="text-lg font-bold text-primary-blue mt-4">No matching expeditions found</h3>
      <p class="text-sm text-gray-600 mt-2">Try adjusting your search criteria or explore other categories.</p>
      <button (click)="selectedCategory = 'all'; searchQuery = ''; fetchTours()" class="mt-6 px-5 py-2 rounded-xl bg-secondary-gold text-pure-white font-semibold text-xs">
        Reset Filters
      </button>
    </div>

    <!-- Loading Skeletons -->
    <div *ngIf="loading()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let _ of [1,2,3,4,5,6]" class="h-96 rounded-2xl bg-gray-100 border border-gray-200 animate-pulse"></div>
    </div>

  </div>
</div>
